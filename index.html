<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>우리 캘린더</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f3f3f3;color:#111;
 font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif
}
.app{max-width:980px;margin:auto;padding:14px 10px 36px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-size:23px;font-weight:900}
.actions{display:flex;gap:6px}
button{
 border:0;background:#fff;border-radius:10px;
 padding:9px 11px;font-weight:700;cursor:pointer
}
.black{background:#111;color:#fff}
.members{display:flex;gap:6px;overflow:auto;margin:10px 0}
.member{background:#fff;border-radius:18px;padding:7px 10px;white-space:nowrap;font-size:12px}
.nav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 9px}
.nav button{font-size:23px;padding:5px 14px}
.month{font-size:19px;font-weight:900}
.cal{
 display:grid;grid-template-columns:repeat(7,1fr);
 gap:1px;background:#111;border:1px solid #111;
 border-radius:13px;overflow:hidden
}
.dow{background:#111;color:#fff;text-align:center;padding:8px 1px;font-size:11px;font-weight:800}
.day{background:#fff;min-height:112px;padding:6px;cursor:pointer}
.day.other{background:#e7e7e7;color:#999}
.day.has{background:#d5d5d5}
.day.sel{box-shadow:inset 0 0 0 3px #111}
.num{font-weight:900;font-size:13px;margin-bottom:4px}
.ev{
 border-radius:4px;padding:3px 4px;margin:2px 0;
 font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.ev .person{opacity:.7}
.detail{margin-top:12px;background:#fff;border-radius:14px;padding:14px}
.detailtop{display:flex;justify-content:space-between;align-items:center}
.detail h2{font-size:16px;margin:0}
.item{display:flex;gap:9px;align-items:center;border-top:1px solid #eee;padding:11px 0}
.bar{width:7px;min-height:42px;border-radius:6px}
.main{flex:1}
.name{font-weight:900}
.meta{font-size:11px;color:#777;margin-top:3px}
.tag{display:inline-block;margin-top:5px;background:#eee;border-radius:12px;padding:4px 8px;font-size:10px}
.empty{text-align:center;color:#999;padding:18px;font-size:12px}
.modal{
 position:fixed;inset:0;background:#0008;
 display:flex;align-items:flex-end;z-index:10
}
.hidden{display:none}
.sheet{
 background:#fff;width:min(620px,100%);
 margin:auto;border-radius:22px 22px 0 0;
 padding:18px;max-height:94vh;overflow:auto
}
.sheettop{display:flex;justify-content:space-between}
.sheet h2{margin:0 0 12px}
.label{display:block;font-size:12px;font-weight:800;margin:9px 0}
.input{
 width:100%;margin-top:5px;padding:11px;
 border:1px solid #ddd;border-radius:10px;font:inherit
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.colors{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:6px}
.c{height:29px;border-radius:7px;border:2px solid transparent}
.c.on{border-color:#fff;outline:2px solid #111}
.save{width:100%;background:#111;color:#fff;padding:13px;margin-top:11px}
.delete{width:100%;background:#ffe7e7;color:#c00;padding:12px;margin-top:7px}
.sharebox{background:#f4f4f4;border-radius:12px;padding:10px;margin-top:10px}
.shareurl{font-size:10px;word-break:break-all;max-height:65px;overflow:auto;margin:7px 0;color:#555}
.copy{width:100%;background:#111;color:#fff}
@media(max-width:600px){
 .day{min-height:78px;padding:4px}
 .ev{font-size:8px;padding:2px}
 .cal{border-radius:9px}
 .actions button{padding:8px}
}
</style>
</head>
<body>
<div class="app">
<div class="top">
 <div class="brand">우리 캘린더</div>
 <div class="actions">
  <button type="button" onclick="today()">오늘</button>
  <button type="button" onclick="openForm()" class="black">＋ 일정</button>
  <button type="button" onclick="makeShare()" class="black">공유</button>
 </div>
</div>
<div class="members" id="members"></div>
<div class="nav">
 <button type="button" onclick="move(-1)">‹</button>
 <div class="month" id="month"></div>
 <button type="button" onclick="move(1)">›</button>
</div>
<div class="cal" id="cal"></div>
<div class="detail">
 <div class="detailtop">
  <h2 id="dt"></h2>
  <button type="button" onclick="openForm()" class="black">＋ 일정 추가</button>
 </div>
 <div id="list"></div>
</div>
</div>
<div class="modal hidden" id="formModal">
<div class="sheet">
<div class="sheettop">
 <h2 id="ft">일정 추가</h2>
 <button type="button" onclick="closeForm()">×</button>
</div>
<form id="form">
<input type="hidden" id="eid">
<label class="label">
 날짜
 <input class="input" id="date" type="date" required>
</label>
<label class="label">
 일정 이름
 <input class="input" id="name" maxlength="80" required placeholder="예: 출근, 생일, 약속">
</label>
<div class="row">
 <label class="label">
  시작
  <input class="input" id="time" type="time">
 </label>
 <label class="label">
  종료
  <input class="input" id="end" type="time">
 </label>
</div>
<label class="label">
 멤버
 <select class="input" id="person"></select>
</label>
<label class="label">
 메모
 <textarea class="input" id="note" rows="3"></textarea>
</label>
<label class="label">
 색상
 <div class="colors" id="colors"></div>
</label>
<input type="hidden" id="color">
<button type="submit" class="save">저장</button>
<button type="button" class="delete hidden" id="del">삭제</button>
</form>
</div>
</div>
<div class="modal hidden" id="shareModal">
<div class="sheet">
<div class="sheettop">
 <h2>캘린더 공유</h2>
 <button type="button" onclick="closeShare()">×</button>
</div>
<p style="font-size:13px;color:#666">
 아래 링크를 복사해서 보내면 현재 일정이 들어있는 캘린더를 열 수 있어
</p>
<div class="sharebox">
 <div class="shareurl" id="shareurl"></div>
 <button type="button" class="copy" onclick="copyShare()">링크 복사</button>
</div>
<p style="font-size:11px;color:#999;margin-top:12px">
 ※ 현재 버전은 각 기기에 일정을 저장하는 방식이야
</p>
</div>
</div>
<script>
const colors=[
["빨강","#ef4444"],["주황","#f97316"],["노랑","#eab308"],
["연두","#84cc16"],["초록","#22c55e"],["민트","#14b8a6"],
["청록","#06b6d4"],["하늘","#38bdf8"],["파랑","#3b82f6"],
["남색","#4f46e5"],["보라","#8b5cf6"],["자주","#a855f7"],
["분홍","#ec4899"],["진분홍","#db2777"],["갈색","#92400e"],
["회색","#6b7280"],["검정","#111"],["연보라","#c4b5fd"],
["연분홍","#f9a8d4"],["연파랑","#93c5fd"],["연초록","#86efac"],
["연주황","#fdba74"],["금색","#ca8a04"],["청회색","#64748b"]
];
const STORAGE_EVENTS="ourCalendar_events";
const STORAGE_MEMBERS="ourCalendar_members";
let members=[];
let events=[];
try{
 members=JSON.parse(localStorage.getItem(STORAGE_MEMBERS)) ||
 ["가은","멤버 2","멤버 3","멤버 4"];
}catch(e){
 members=["가은","멤버 2","멤버 3","멤버 4"];
}
try{
 events=JSON.parse(localStorage.getItem(STORAGE_EVENTS)) || [];
}catch(e){
 events=[];
}
let view=new Date();
let selected=new Date();
const pad=n=>String(n).padStart(2,"0");
const key=d=>
 `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const esc=s=>
 String(s||"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
function save(){
 try{
  localStorage.setItem(
   STORAGE_EVENTS,
   JSON.stringify(events)
  );
  localStorage.setItem(
   STORAGE_MEMBERS,
   JSON.stringify(members)
  );
  return true;
 }catch(error){
  console.error(error);
  alert(
   "저장에 실패했어\n\n" +
   "Safari에서 사이트 저장이 차단되어 있을 수 있어"
  );
  return false;
 }
}
function setup(){
 renderMembers();
 document.getElementById("person").innerHTML=
 members.map(x=>
  `<option value="${esc(x)}">${esc(x)}</option>`
 ).join("");
 document.getElementById("colors").innerHTML=
 colors.map(c=>
  `<button type="button" class="c"
   title="${c[0]}"
   data-v="${c[1]}"
   style="background:${c[1]}"></button>`
 ).join("");
 document.querySelectorAll(".c").forEach(b=>{
  b.addEventListener("click",()=>{
   document.querySelectorAll(".c")
    .forEach(x=>x.classList.remove("on"));
   b.classList.add("on");
   document.getElementById("color").value=
    b.dataset.v;
  });
 });
}
function renderMembers(){
 document.getElementById("members").innerHTML=
 members.map(m=>
  `<span class="member">● ${esc(m)}</span>`
 ).join("");
}
function render(){
 document.getElementById("month").textContent=
 `${view.getFullYear()}년 ${view.getMonth()+1}월`;
 const cal=document.getElementById("cal");
 cal.innerHTML=
 ["일","월","화","수","목","금","토"]
 .map(x=>`<div class="dow">${x}</div>`)
 .join("");
 let first=new Date(
  view.getFullYear(),
  view.getMonth(),
  1
 );
 let start=new Date(first);
 start.setDate(
  1-first.getDay()
 );
 for(let i=0;i<42;i++){
  let d=new Date(start);
  d.setDate(start.getDate()+i);
  let es=events.filter(
   e=>e.date===key(d)
  );
  let c=document.createElement("div");
  c.className=
   "day"+
   (d.getMonth()!=view.getMonth()?" other":"")+
   (es.length?" has":"")+
   (key(d)==key(selected)?" sel":"");
  c.onclick=()=>{
   selected=new Date(d);
   render();
  };
  c.innerHTML=
   `<div class="num">${d.getDate()}</div>`+
   es.slice(0,4).map(e=>
    `<div class="ev"
     style="background:${e.color}22;color:#111"
     onclick="event.stopPropagation();edit('${e.id}')">
     ${esc(e.name)}
     ${e.person?
      `<span class="person">· ${esc(e.person)}</span>`
      :""
     }
    </div>`
   ).join("");
  cal.appendChild(c);
 }
 renderDetail();
}
function renderDetail(){
 const dt=document.getElementById("dt");
 const list=document.getElementById("list");
 dt.textContent=
 `${selected.getFullYear()}년 `+
 `${selected.getMonth()+1}월 `+
 `${selected.getDate()}일`;
 let es=events
  .filter(e=>e.date===key(selected))
  .sort((a,b)=>
   (a.time||"99").localeCompare(b.time||"99")
  );
 if(!es.length){
  list.innerHTML=
   '<div class="empty">일정이 없는 날이에요</div>';
  return;
 }
 list.innerHTML=es.map(e=>
  `<div class="item">
   <div class="bar" style="background:${e.color}"></div>
   <div class="main">
    <div class="name">${esc(e.name)}</div>
    <div class="meta">
     ${e.time||"시간 미정"}
     ${e.end?" ~ "+e.end:""}
    </div>
    <span class="tag">${esc(e.person)}</span>
    ${e.note?
     `<div class="meta">${esc(e.note)}</div>`
     :""
    }
   </div>
   <button type="button"
    onclick="edit('${e.id}')">
    수정
   </button>
  </div>`
 ).join("");
}
function openForm(e={}){
 document.getElementById("formModal")
  .classList.remove("hidden");
 document.getElementById("eid").value=e.id||"";
 document.getElementById("date").value=e.date||key(selected);
 document.getElementById("name").value=e.name||"";
 document.getElementById("time").value=e.time||"";
 document.getElementById("end").value=e.end||"";
 document.getElementById("person").value=
  e.person||members[0]||"";
 document.getElementById("note").value=e.note||"";
 document.getElementById("color").value=
  e.color||colors[0][1];
 document.getElementById("ft").textContent=
  e.id?"일정 수정":"일정 추가";
 document.getElementById("del")
  .classList.toggle("hidden",!e.id);
 document.querySelectorAll(".c").forEach(x=>
  x.classList.toggle(
   "on",
   x.dataset.v===(e.color||colors[0][1])
  )
 );
}
function edit(id){
 const event=events.find(e=>e.id===id);
 if(event) openForm(event);
}
function closeForm(){
 document.getElementById("formModal")
  .classList.add("hidden");
}
document.getElementById("form")
.addEventListener("submit",function(e){
 e.preventDefault();
 const eid=document.getElementById("eid").value;
 const item={
  id:eid || (
   Date.now().toString(36)+
   Math.random().toString(36).slice(2)
  ),
  date:document.getElementById("date").value,
  name:document.getElementById("name")
   .value.trim(),
  time:document.getElementById("time").value,
  end:document.getElementById("end").value,
  person:document.getElementById("person").value,
  note:document.getElementById("note")
   .value.trim(),
  color:document.getElementById("color").value||
   colors[0][1]
 };
 if(!item.date || !item.name){
  alert("날짜와 일정 이름을 입력해줘");
  return;
 }
 if(eid){
  const index=
   events.findIndex(x=>x.id===eid);
  if(index!==-1){
   events[index]=item;
  }else{
   events.push(item);
  }
 }else{
  events.push(item);
 }
 if(!save()) return;
 selected=
  new Date(item.date+"T00:00:00");
 view=
  new Date(selected);
 closeForm();
 render();
 alert("저장됐어 👍");
});
document.getElementById("del")
.addEventListener("click",function(){
 const id=
  document.getElementById("eid").value;
 events=
  events.filter(e=>e.id!==id);
 save();
 closeForm();
 render();
});
function move(n){
 view.setMonth(
  view.getMonth()+n
 );
 render();
}
function today(){
 view=new Date();
 selected=new Date();
 render();
}
function encodeData(){
 const data=
  JSON.stringify({
   events,
   members
  });
 return btoa(
  encodeURIComponent(data)
 );
}
function decodeData(s){
 try{
  return JSON.parse(
   decodeURIComponent(
    atob(s)
   )
  );
 }catch(e){
  return null;
 }
}
function makeShare(){
 const data=encodeData();
 const url=
  location.href.split("#")[0]+
  "#share="+data;
 document.getElementById("shareurl")
  .textContent=url;
 document.getElementById("shareModal")
  .classList.remove("hidden");
 window._shareUrl=url;
}
function closeShare(){
 document.getElementById("shareModal")
  .classList.add("hidden");
}
async function copyShare(){
 const url=window._shareUrl;
 try{
  await navigator.clipboard.writeText(url);
  alert("링크가 복사됐어 👍");
 }catch(e){
  prompt(
   "아래 링크를 복사해줘",
   url
  );
 }
}
function loadShare(){
 const hash=location.hash;
 if(!hash.startsWith("#share="))
  return;
 const data=
  decodeData(
   hash.substring(7)
  );
 if(
  data &&
  Array.isArray(data.events)
 ){
  events=data.events;
  if(Array.isArray(data.members))
   members=data.members;
  save();
  setup();
  history.replaceState(
   null,
   "",
   location.pathname+
   location.search
  );
 }
}
setup();
loadShare();
render();
</script>
</body>
</html>
